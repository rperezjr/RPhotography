<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPhotography - Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SIDEBAR NAVIGATION -->
  <aside class="sidebar">
    <div class="brand-logo">RP</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li>
      </ul>
    </nav>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <main class="main-content">
    <header class="home-hero">
      <span class="lightbox-subtitle">MONETT SOCCER ARCHIVE</span>
      <h1 class="home-title">Matches</h1>
      <p class="home-desc">Select a match below to open its dedicated photo gallery.</p>
    </header>

    <section class="matches-overview">
      <div class="matches-header-row" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 25px;">
        <h2 class="section-title" style="margin-bottom: 0;">Available Matches</h2>
        
        <!-- SEARCH & SORT CONTROLS -->
        <div class="filter-container" style="display: flex; gap: 15px; flex-wrap: wrap;">
          <input 
            type="text" 
            id="home-search-input" 
            placeholder="Search matches (e.g., Parkview, Nixa)..." 
            style="padding: 10px 14px; width: 280px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 14px; outline: none;" 
          />
          
          <select 
            id="home-sort-select" 
            style="padding: 10px 14px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 14px; outline: none; cursor: pointer;"
          >
            <option value="newest">Sort: Newest First</option>
            <option value="oldest">Sort: Oldest First</option>
            <option value="name">Sort: Name (A-Z)</option>
          </select>
        </div>
      </div>
      
      <div class="match-cards-grid" id="home-match-cards">
        <!-- Generated dynamically with preview thumbnails by home.js -->
      </div>
    </section>
  </main>

  <script src="home.js"></script>
</body>
</html>
