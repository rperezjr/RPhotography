<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPhotography - Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SIDEBAR NAVIGATION -->
  <aside class="sidebar">
    <div class="brand-logo">R</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li>
      </ul>
    </nav>
    <!-- Admin / Dashboard Link -->
    <div style="margin-top: auto; padding: 20px; font-size: 0.85rem;">
      <a href="dashboard.html" id="auth-link" style="color: #888; text-decoration: none;">Admin Login</a>
    </div>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <main class="main-content">
    <header class="home-hero">
      <span class="lightbox-subtitle">MONETT SOCCER ARCHIVE</span>
      <h1 class="home-title">Matches</h1>
      <p class="home-desc">Select a match below to open its dedicated photo gallery.</p>
    </header>

    <section class="matches-overview">
      <h2 class="section-title">Available Matches</h2>
      <div class="match-cards-grid" id="home-match-cards">
        <!-- Generated dynamically by home.js -->
      </div>
    </section>
  </main>

  <script src="photos-data.js"></script>
  <script src="home.js"></script>
</body>
</html>
