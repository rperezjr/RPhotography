<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPhotography - Admin Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-login-wrap { max-width: 400px; margin: 100px auto; padding: 30px; background: #1a1a1a; border-radius: 8px; border: 1px solid #333; text-align: center; }
    .admin-login-wrap input { width: 100%; padding: 10px; margin: 10px 0; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
    .admin-login-wrap button { width: 100%; padding: 10px; background: #fff; color: #000; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
    .badge-status { display: inline-block; padding: 2px 8px; font-size: 0.7rem; border-radius: 4px; margin-top: 8px; font-weight: bold; }
    .badge-edited { background: #2e7d32; color: #fff; }
    .badge-unedited { background: #c62828; color: #fff; }
  </style>
</head>
<body>

  <!-- SIDEBAR NAVIGATION -->
  <aside class="sidebar">
    <div class="brand-logo">R</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="dashboard.html" class="active">Dashboard</a></li>
      </ul>
    </nav>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <main class="main-content">

    <!-- LOGIN CONTAINER -->
    <div id="login-container" class="admin-login-wrap" style="display: none;">
      <h2>Admin Login</h2>
      <p style="color: #aaa; font-size: 0.9rem;">Log in to access photo editing dashboard.</p>
      <input type="password" id="admin-password" placeholder="Enter password (monett2026)">
      <button onclick="performLogin()">Login</button>
      <p id="login-error" style="color: #ff5252; font-size: 0.85rem; margin-top: 10px;"></p>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboard-content" style="display: none;">
      <header class="home-hero" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span class="lightbox-subtitle">ADMIN CONTROL PANEL</span>
          <h1 class="home-title">Matches Dashboard</h1>
          <p class="home-desc">Click any match card below to open its gallery and edit photos.</p>
        </div>
        <button onclick="performLogout()" style="padding: 8px 16px; background: #c62828; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; height: fit-content;">Logout</button>
      </header>

      <section class="matches-overview">
        <h2 class="section-title">Available Matches</h2>
        <div class="match-cards-grid" id="home-match-cards">
          <!-- Populated identically to the home page -->
        </div>
      </section>
    </div>

  </main>

  <script src="photos-data.js"></script>
  <script src="home.js"></script> <!-- Reuses exact home page rendering logic -->
  <script>
    const ADMIN_PASS = "monett2026";

    function checkAuth() {
      if (localStorage.getItem("isLoggedIn") === "true") {
        document.getElementById("dashboard-content").style.display = "block";
        document.getElementById("login-container").style.display = "none";
        
        // Enhance rendered cards with click-to-edit and edit status badges
        enhanceDashboardCards();
      } else {
        document.getElementById("login-container").style.display = "block";
        document.getElementById("dashboard-content").style.display = "none";
      }
    }

    function performLogin() {
      const val = document.getElementById("admin-password").value;
      if (val === ADMIN_PASS) {
        localStorage.setItem("isLoggedIn", "true");
        checkAuth();
      } else {
        document.getElementById("login-error").textContent = "Incorrect password.";
      }
    }

    function performLogout() {
      localStorage.removeItem("isLoggedIn");
      checkAuth();
    }

    function enhanceDashboardCards() {
      const photos = getSitePhotos();
      const cards = document.querySelectorAll("#home-match-cards .match-card");

      cards.forEach((card, index) => {
        const photo = photos[index];
        if (!photo) return;

        // Make the card clickable to navigate to gallery edit mode
        card.style.cursor = "pointer";
        card.onclick = () => {
          window.location.href = `gallery.html?match=${photo.id}`;
        };

        // Append edited/unedited status badge if not already present
        const contentDiv = card.querySelector(".match-card-content");
        if (contentDiv && !contentDiv.querySelector(".badge-status")) {
          const badge = document.createElement("span");
          badge.className = `badge-status ${photo.edited ? 'badge-edited' : 'badge-unedited'}`;
          badge.textContent = photo.edited ? 'Edited' : 'Unedited';
          contentDiv.appendChild(badge);
        }
      });
    }

    window.addEventListener("DOMContentLoaded", checkAuth);
  </script>
</body>
</html>
